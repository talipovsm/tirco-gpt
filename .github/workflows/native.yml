name: Native apps

# Сборка нативных приложений Tirco (Flutter): проверки + Android (APK), iOS (без подписи), macOS, Windows.
# Адрес API для сборок — переменная репозитория TIRCO_API (Settings → Variables), обязательна: без неё сборки не запускаются,
# чтобы приложения случайно не ушли на старый стенд (OPS-04). Проверки (analyze/test) работают и без неё.
# Подложка карт — переменная GEOAPIFY_KEY (публичный ключ карт Geoapify); пусто — тайлы OSM.
on:
  push:
    branches: [main]
    paths: ["native/**", ".github/workflows/native.yml"]
  pull_request:
    paths: ["native/**", ".github/workflows/native.yml"]
  workflow_dispatch:

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.5"
  API_DEFINE: --dart-define=TIRCO_API=${{ vars.TIRCO_API }} --dart-define=GEOAPIFY_KEY=${{ vars.GEOAPIFY_KEY }}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: "${{ env.FLUTTER_VERSION }}", channel: stable, cache: true }
      - name: Analyze & test
        run: |
          for d in packages/tirco_core apps/tirco apps/driver; do
            echo "::group::$d"
            (cd "native/$d" && flutter pub get && flutter analyze && flutter test)
            echo "::endgroup::"
          done

  # Без TIRCO_API сборки не выполняются. В pull request это предупреждение (проверки analyze/test проходят,
  # сборки пропускаются), при push в main и ручном запуске — ошибка: релизные сборки без адреса API не собираются.
  config:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.api.outputs.build }}
    steps:
      - name: TIRCO_API задан
        id: api
        env:
          TIRCO_API: ${{ vars.TIRCO_API }}
          EVENT: ${{ github.event_name }}
        run: |
          problem=""
          if [ -z "$TIRCO_API" ]; then
            problem="Не задана переменная репозитория TIRCO_API (Settings → Secrets and variables → Actions → Variables) — адрес API Tirco для сборок."
          else
            case "$TIRCO_API" in https://*) ;; *) problem="TIRCO_API должен начинаться с https://";; esac
          fi
          if [ -z "$problem" ]; then echo "build=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "build=false" >> "$GITHUB_OUTPUT"
          if [ "$EVENT" = "pull_request" ]; then echo "::warning::$problem Сборки пропущены."; exit 0; fi
          echo "::error::$problem"
          exit 1

  android:
    needs: [checks, config]
    if: needs.config.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      matrix: { app: [tirco, driver] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: "${{ env.FLUTTER_VERSION }}", channel: stable, cache: true }
      - name: Build APK
        working-directory: native/apps/${{ matrix.app }}
        run: flutter build apk --release $API_DEFINE
      - uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.app }}
          path: native/apps/${{ matrix.app }}/build/app/outputs/flutter-apk/app-release.apk

  ios:
    needs: [checks, config]
    if: needs.config.outputs.build == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      matrix: { app: [tirco, driver] }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: "${{ env.FLUTTER_VERSION }}", channel: stable, cache: true }
      - name: Build iOS (без подписи)
        working-directory: native/apps/${{ matrix.app }}
        run: |
          flutter build ios --release --no-codesign $API_DEFINE
          cd build/ios/iphoneos && zip -qry "$GITHUB_WORKSPACE/ios-${{ matrix.app }}.zip" Runner.app
      - uses: actions/upload-artifact@v4
        with: { name: "ios-${{ matrix.app }}-unsigned", path: "ios-${{ matrix.app }}.zip" }

  macos:
    needs: [checks, config]
    if: needs.config.outputs.build == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: "${{ env.FLUTTER_VERSION }}", channel: stable, cache: true }
      - name: Build macOS
        working-directory: native/apps/tirco
        run: |
          flutter build macos --release $API_DEFINE
          cd build/macos/Build/Products/Release && ditto -c -k --keepParent Tirco.app "$GITHUB_WORKSPACE/Tirco-macos.zip"
      - uses: actions/upload-artifact@v4
        with: { name: macos-tirco, path: Tirco-macos.zip }

  windows:
    needs: [checks, config]
    if: needs.config.outputs.build == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: "${{ env.FLUTTER_VERSION }}", channel: stable, cache: true }
      - name: Build Windows
        working-directory: native/apps/tirco
        shell: bash
        run: flutter build windows --release $API_DEFINE
      - uses: actions/upload-artifact@v4
        with: { name: windows-tirco, path: native/apps/tirco/build/windows/x64/runner/Release }
