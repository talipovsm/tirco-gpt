name: Workspace review

on:
  push:
    branches: ["redesign/operations-workspace"]

permissions:
  contents: read

concurrency:
  group: workspace-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tirco_review
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tirco_review?schema=public
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tirco_review?schema=public
      APP_SECRET: ci-secret-ci-secret-ci-secret-ci-secret-0000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format workspace files
        run: |
          npx prettier --write src/components/common/split-view.tsx src/features/operations/live-workspace.tsx src/features/operations/health.tsx src/components/layout/app-shell.tsx src/components/common/url-tabs.tsx src/components/layout/command-bar.tsx src/components/layout/notification-bell.tsx src/components/layout/user-menu.tsx src/features/operations/shipment-panel.tsx src/features/fleet/fleet-workspace.tsx tests/e2e/workspace-mobile.spec.ts
          git diff > workspace-format.patch
          cat workspace-format.patch
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser journeys and mobile review
        run: npm run build && npx playwright test tests/e2e/workspace-mobile.spec.ts
      - name: Mobile preview image
        if: always()
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          if (!fs.existsSync("test-results")) process.exit(0);
          const file = fs.readdirSync("test-results", { recursive: true }).find((name) => name.endsWith("operations-390.png"));
          if (file) {
            console.log("TIRCO_PREVIEW_START");
            console.log(fs.readFileSync("test-results/" + file).toString("base64").match(/.{1,100}/g).join("\n"));
            console.log("TIRCO_PREVIEW_END");
          }
          NODE
      - name: Screenshots and browser report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workspace-browser-review
          path: |
            workspace-format.patch
            playwright-report/
            test-results/
          retention-days: 7
